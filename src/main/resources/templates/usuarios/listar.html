<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout('Gestión de Usuarios', ~{::content})}">
<body>

<div th:fragment="content">
    <!-- Encabezado con Botón Nuevo -->
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold">Gestión de Usuarios</h2>
            <span class="text-secondary small">Lista de cuentas y clientes registrados</span>
        </div>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-gold btn-sm px-3">
            <i class="bi bi-person-plus-fill me-1"></i> + Nuevo Usuario
        </a>
    </div>

    <!-- Tabla de Usuarios -->
    <div class="table-dark-custom p-3">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width: 70px;">Foto</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <!-- Foto o Avatar por defecto -->
                        <td>
                            <div th:if="${u.fotoUrl != null && !#strings.isEmpty(u.fotoUrl)}">
                                <img th:src="${u.fotoUrl}" 
                                     alt="Foto" 
                                     class="rounded-circle border border-secondary shadow-sm" 
                                     style="width: 44px; height: 44px; object-fit: cover;">
                            </div>
                            <div th:unless="${u.fotoUrl != null && !#strings.isEmpty(u.fotoUrl)}" 
                                 class="rounded-circle bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center text-muted" 
                                 style="width: 44px; height: 44px;">
                                <i class="bi bi-person-fill fs-5"></i>
                            </div>
                        </td>

                        <td class="fw-bold text-white" th:text="${u.nombre}">Usuario</td>
                        <td th:text="${u.correo}">correo@dominio.com</td>
                        <td th:text="${u.telefono != null && !u.telefono.isEmpty() ? u.telefono : '-'}">-</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${u.rol == 'ADMIN' ? 'bg-danger' : (u.rol == 'BARBERO' ? 'bg-warning text-dark' : 'bg-info text-dark')}"
                                  th:text="${u.rol == 'BARBERO' ? 'JEFE LOCAL' : u.rol}">JEFE LOCAL</span>
                        </td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${u.estado == 'ACTIVO' ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${u.estado}">ACTIVO</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/admin/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-outline-warning" title="Editar">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <!-- Se reemplazó el onclick por la clase btn-eliminar -->
                                <a th:href="@{/admin/usuarios/eliminar/{id}(id=${u.idUsuario})}" 
                                   class="btn btn-outline-danger btn-eliminar" 
                                   title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center text-secondary py-4">
                            No se encontraron usuarios registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS PARA SWEETALERT2 -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Mostrar mensajes de éxito (ej. Usuario guardado)
            var mensajeExito = /*[[${mensaje}]]*/ null;
            if (mensajeExito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Operación Exitosa!',
                    text: mensajeExito,
                    background: '#212529',
                    color: '#ffffff',
                    confirmButtonColor: '#d4af37',
                    confirmButtonText: 'Aceptar'
                });
            }

            // 1.1 Mostrar mensajes de error (si viene desde el controlador)
            var mensajeError = /*[[${error}]]*/ null;
            if (mensajeError) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensajeError,
                    background: '#212529',
                    color: '#ffffff',
                    confirmButtonColor: '#dc3545',
                    confirmButtonText: 'Entendido'
                });
            }

            // 2. Lógica para el botón de Eliminar Usuario
            const botonesEliminar = document.querySelectorAll('.btn-eliminar');
            
            botonesEliminar.forEach(boton => {
                boton.addEventListener('click', function(e) {
                    e.preventDefault(); // Detiene la redirección inmediata
                    const urlDestino = this.getAttribute('href'); 

                    Swal.fire({
                        title: '¿Eliminar Usuario?',
                        text: '¿Seguro que deseas eliminar a este usuario del sistema? Esta acción no se puede deshacer.',
                        icon: 'warning',
                        showCancelButton: true,
                        background: '#212529',
                        color: '#ffffff',
                        confirmButtonColor: '#dc3545', // Botón rojo
                        cancelButtonColor: '#6c757d',  // Botón gris
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        // Si confirma, ejecutamos el link
                        if (result.isConfirmed) {
                            window.location.href = urlDestino;
                        }
                    });
                });
            });
        });
        /*]]>*/
    </script>
</div>

</body>
</html>
