<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout(${usuarioForm.idUsuario == null ? 'Nuevo Usuario' : 'Editar Usuario'}, ~{::content})}">
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold" th:text="${usuarioForm.idUsuario == null ? 'Registrar Nuevo Usuario / Cliente' : 'Editar Información de Usuario'}"></h2>
            <span class="text-secondary small">Define sus credenciales y datos de contacto</span>
        </div>
        <a th:href="@{/admin/usuarios}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4">
                <form th:action="@{/admin/usuarios/guardar}" th:object="${usuarioForm}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{idUsuario}">
                    <input type="hidden" th:field="*{fotoUrl}">

                    <div class="row g-3">
                        <!-- Nombre -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Nombre Completo *</label>
                            <input type="text" th:field="*{nombre}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Juan Pérez" required>
                        </div>

                        <!-- Correo -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Correo Electrónico *</label>
                            <input type="email" th:field="*{correo}" class="form-control bg-dark text-white border-secondary" placeholder="ejemplo@correo.com" required>
                        </div>

                        <!-- Contraseña -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">
                                Contraseña <span th:if="${usuarioForm.idUsuario != null}">(Dejar en blanco para mantener actual)</span>*
                            </label>
                            <input type="password" th:field="*{password}" class="form-control bg-dark text-white border-secondary" 
                                   th:required="${usuarioForm.idUsuario == null}" placeholder="******">
                        </div>

                        <!-- Teléfono -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Teléfono</label>
                            <input type="text" th:field="*{telefono}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. 999888777">
                        </div>

                        <!-- Rol -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Rol del Sistema</label>
                            <select th:field="*{rol}" class="form-select bg-dark text-white border-secondary">
                                <option value="CLIENTE">CLIENTE</option>
                                <option value="BARBERO">JEFE LOCAL</option>
                                <option value="ADMIN">ADMINISTRADOR</option>
                            </select>
                        </div>

                        <!-- Estado -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Estado</label>
                            <select th:field="*{estado}" class="form-select bg-dark text-white border-secondary">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>

                        <!-- Foto con opción de Tomar Foto o Galería -->
                        <div class="col-12">
                            <label class="form-label text-secondary small">Foto de Perfil (Opcional)</label>
                            <input type="file" 
                                   name="archivoFoto" 
                                   id="archivoFoto" 
                                   class="form-control bg-dark text-white border-secondary" 
                                   accept="image/*">
                            <div class="form-text text-secondary small">
                                En celulares permite elegir entre capturar foto al instante o seleccionar desde la galería.
                            </div>
                        </div>

                        <!-- Previsualización si ya existe foto -->
                        <div class="col-12 text-center py-2" th:if="${usuarioForm.fotoUrl != null and !usuarioForm.fotoUrl.isEmpty()}">
                            <span class="text-secondary small d-block mb-2">Foto actual registrada:</span>
                            <img th:src="${usuarioForm.fotoUrl}" class="rounded-circle border border-warning object-fit-cover shadow" style="width: 80px; height: 80px;" alt="Foto Usuario">
                        </div>

                        <!-- Botones de Acción -->
                        <div class="col-12 mt-4 d-flex justify-content-end gap-2 border-top border-secondary pt-3">
                            <a th:href="@{/admin/usuarios}" class="btn btn-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-gold px-4">
                                <i class="bi bi-save me-1"></i> Guardar Usuario
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
