<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout(${usuarioForm.idUsuario == null ? 'Nuevo Usuario' : 'Editar Usuario'}, ~{::content})}">
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold" th:text="${usuarioForm.idUsuario == null ? 'Registrar Nuevo Usuario / Cliente' : 'Editar Información de Usuario'}"></h2>
            <span class="text-secondary small">Define sus credenciales y datos de contacto</span>
        </div>
        <a th:href="@{/admin/usuarios}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4 bg-dark">
                <!-- Se agregó el ID formUsuario para el SweetAlert -->
                <form id="formUsuario" th:action="@{/admin/usuarios/guardar}" th:object="${usuarioForm}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{idUsuario}">
                    <input type="hidden" th:field="*{fotoUrl}">

                    <div class="row g-3">
                        <!-- Nombre -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Nombre Completo *</label>
                            <input type="text" th:field="*{nombre}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Juan Pérez" required>
                        </div>

                        <!-- Correo -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Correo Electrónico *</label>
                            <input type="email" th:field="*{correo}" class="form-control bg-dark text-white border-secondary" placeholder="ejemplo@correo.com" required>
                        </div>

                        <!-- Contraseña -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">
                                Contraseña <span th:if="${usuarioForm.idUsuario != null}">(Dejar en blanco para mantener actual)</span><span th:if="${usuarioForm.idUsuario == null}">*</span>
                            </label>
                            <input type="password" th:field="*{password}" class="form-control bg-dark text-white border-secondary" 
                                   th:required="${usuarioForm.idUsuario == null}" placeholder="******">
                        </div>

                        <!-- Teléfono -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Teléfono</label>
                            <input type="text" th:field="*{telefono}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. 999888777">
                        </div>

                        <!-- Rol -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Rol del Sistema</label>
                            <select th:field="*{rol}" class="form-select bg-dark text-white border-secondary">
                                <option value="CLIENTE">CLIENTE</option>
                                <option value="BARBERO">JEFE LOCAL</option>
                                <option value="ADMIN">ADMINISTRADOR</option>
                            </select>
                        </div>

                        <!-- Estado -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Estado</label>
                            <select th:field="*{estado}" class="form-select bg-dark text-white border-secondary">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>

                        <!-- Foto con opción de Tomar Foto o Galería -->
                        <div class="col-12">
                            <label class="form-label text-secondary small">Foto de Perfil (Opcional)</label>
                            <!-- ID cambiado a inputFoto para previsualización JS -->
                            <input type="file" 
                                   name="archivoFoto" 
                                   id="inputFoto" 
                                   class="form-control bg-dark text-white border-secondary" 
                                   accept="image/*">
                            <div class="form-text text-secondary small">
                                En celulares permite elegir entre capturar foto al instante o seleccionar desde la galería.
                            </div>
                        </div>

                        <!-- Previsualización Dinámica de la Foto -->
                        <div class="col-12 text-center py-2" id="previewContainer" th:style="${usuarioForm.fotoUrl != null and !usuarioForm.fotoUrl.isEmpty() ? 'display:block;' : 'display:none;'}">
                            <span class="text-secondary small d-block mb-2" id="previewTexto">
                                <span th:text="${usuarioForm.fotoUrl != null and !usuarioForm.fotoUrl.isEmpty() ? 'Foto actual registrada:' : 'Previsualización de nueva foto:'}"></span>
                            </span>
                            <img id="previewImg" th:src="${usuarioForm.fotoUrl != null ? usuarioForm.fotoUrl : '#'}" 
                                 class="rounded-circle border border-warning object-fit-cover shadow" 
                                 style="width: 90px; height: 90px;" alt="Foto Usuario">
                        </div>

                        <!-- Botones de Acción -->
                        <div class="col-12 mt-4 d-flex justify-content-end gap-2 border-top border-secondary pt-3">
                            <a th:href="@{/admin/usuarios}" class="btn btn-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-gold px-4">
                                <i class="bi bi-save me-1"></i> Guardar Usuario
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS PARA PREVIEW Y SWEETALERT2 -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Mostrar alertas si falla el guardado (ej. correo duplicado)
            var mensajeError = /*[[${error}]]*/ null;
            if (mensajeError) {
                Swal.fire({
                    icon: 'error',
                    title: 'No se pudo guardar',
                    text: mensajeError,
                    background: '#212529',
                    color: '#ffffff',
                    confirmButtonColor: '#dc3545',
                    confirmButtonText: 'Entendido'
                });
            }

            // 2. Previsualizar la foto en vivo
            const inputFoto = document.getElementById('inputFoto');
            const previewContainer = document.getElementById('previewContainer');
            const previewImg = document.getElementById('previewImg');
            const previewTexto = document.getElementById('previewTexto');

            if (inputFoto) {
                inputFoto.addEventListener('change', function() {
                    const file = this.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            previewImg.src = e.target.result;
                            previewTexto.innerHTML = 'Previsualización de nueva foto:';
                            previewContainer.style.display = 'block';
                        }
                        reader.readAsDataURL(file);
                    }
                });
            }

            // 3. Bloquear pantalla y mostrar "Guardando..." al enviar
            const form = document.getElementById('formUsuario');
            form.addEventListener('submit', function() {
                Swal.fire({
                    title: 'Guardando Usuario...',
                    text: 'Procesando datos y subiendo imagen, por favor espera.',
                    background: '#212529',
                    color: '#ffffff',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
            });

        });
        /*]]>*/
    </script>
</div>

</body>
</html>
