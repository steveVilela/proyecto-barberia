<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout(${barbero.idBarbero == null ? 'Nuevo Barbero' : 'Editar Barbero'}, ~{::content})}">
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold" th:text="${barbero.idBarbero == null ? 'Registrar Nuevo Barbero' : 'Editar Información del Barbero'}"></h2>
            <span class="text-secondary small">Completa los campos y sube la foto de perfil</span>
        </div>
        <a th:href="@{/barberos}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4 bg-dark">
                <form id="formBarbero" th:action="@{/barberos/guardar}" th:object="${barbero}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{idBarbero}">
                    <input type="hidden" th:field="*{fotoUrl}">

                    <div class="row g-3">
                        <!-- Nombre -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Nombre Completo *</label>
                            <input type="text" th:field="*{nombre}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Mateo Ramírez" required>
                        </div>

                        <!-- Especialidad -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Especialidad</label>
                            <input type="text" th:field="*{especialidad}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Fade, Diseños, Barba clásica">
                        </div>

                        <!-- Estado -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Estado Operativo</label>
                            <select th:field="*{estado}" class="form-select bg-dark text-white border-secondary">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>

                        <!-- Subida de Foto a GCP -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Foto de Perfil (JPG, PNG)</label>
                            <input type="file" 
                                   name="archivoFoto" 
                                   id="inputFoto" 
                                   class="form-control bg-dark text-white border-secondary" 
                                   accept="image/*">
                            <div class="form-text text-secondary small">
                                En celulares permite elegir entre capturar foto o buscar en la galería.
                            </div>
                        </div>

                        <!-- Previsualización de la Foto (Nueva o Actual) -->
                        <div class="col-12 text-center py-2" id="previewContainer" th:style="${barbero.fotoUrl != null and !barbero.fotoUrl.isEmpty() ? 'display:block;' : 'display:none;'}">
                            <span class="text-secondary small d-block mb-2" id="previewTexto">
                                <span th:text="${barbero.fotoUrl != null and !barbero.fotoUrl.isEmpty() ? 'Foto actual en sistema:' : 'Previsualización de nueva foto:'}"></span>
                            </span>
                            <img id="previewImg" th:src="${barbero.fotoUrl != null ? barbero.fotoUrl : '#'}" 
                                 class="rounded-circle border border-warning object-fit-cover shadow" 
                                 style="width: 90px; height: 90px;" alt="Foto Barbero">
                        </div>

                        <!-- Botones de Acción -->
                        <div class="col-12 mt-4 d-flex justify-content-end gap-2 border-top border-secondary pt-3">
                            <a th:href="@{/barberos}" class="btn btn-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-gold px-4">
                                <i class="bi bi-cloud-upload me-1"></i> Guardar Barbero
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS PARA PREVIEW Y SWEETALERT2 -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Mostrar alertas si falla el guardado en el backend
            var mensajeError = /*[[${error}]]*/ null;
            if (mensajeError) {
                Swal.fire({
                    icon: 'error',
                    title: 'No se pudo guardar',
                    text: mensajeError,
                    background: '#212529',
                    color: '#ffffff',
                    confirmButtonColor: '#dc3545',
                    confirmButtonText: 'Revisar'
                });
            }

            // 2. Mostrar la foto apenas se elige (antes de subirla)
            const inputFoto = document.getElementById('inputFoto');
            const previewContainer = document.getElementById('previewContainer');
            const previewImg = document.getElementById('previewImg');
            const previewTexto = document.getElementById('previewTexto');

            if (inputFoto) {
                inputFoto.addEventListener('change', function() {
                    const file = this.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            previewImg.src = e.target.result;
                            previewTexto.innerHTML = 'Previsualización de nueva foto:';
                            previewContainer.style.display = 'block';
                        }
                        reader.readAsDataURL(file);
                    }
                });
            }

            // 3. Evitar doble clic y mostrar pantalla de carga al enviar el formulario
            const form = document.getElementById('formBarbero');
            form.addEventListener('submit', function() {
                Swal.fire({
                    title: 'Guardando...',
                    text: 'Subiendo datos e imagen al servidor, por favor espera.',
                    background: '#212529',
                    color: '#ffffff',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
            });

        });
        /*]]>*/
    </script>
</div>

</body>
</html>
