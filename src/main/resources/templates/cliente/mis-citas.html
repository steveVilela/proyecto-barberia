<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout('Panel Cliente - Mis Citas', ~{::content})}">
<body>

<div th:fragment="content">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold">Panel de Cliente</h2>
            <span class="text-secondary small" th:text="'Bienvenido, ' + ${usuario.nombre}">Cliente</span>
        </div>
		<a th:href="@{/cliente/reservar}" class="btn btn-outline-warning btn-sm">
		    <i class="bi bi-calendar-plus me-1"></i> Reservar Nueva Cita
		</a>
    </div>

    <!-- Catálogo de Servicios Disponibles -->
    <div class="table-dark-custom p-3">
        <h5 class="fw-bold text-white mb-3"><i class="bi bi-scissors me-2"></i>Nuestros Servicios Disponibles</h5>
        <div class="row g-3">
            <div class="col-md-6 col-lg-3" th:each="servicio : ${servicios}">
                <div class="card card-custom h-100 p-3">
                    <img th:if="${servicio.fotoUrl != null}" th:src="${servicio.fotoUrl}" class="card-img-top rounded mb-3" style="height: 140px; object-fit: cover;" alt="Servicio">
                    <div class="card-body p-0 d-flex flex-column justify-content-between">
                        <div>
                            <h6 class="fw-bold text-white mb-1" th:text="${servicio.nombre}">Servicio</h6>
                            <p class="text-secondary small mb-2" th:text="${servicio.descripcion}">Descripción del corte</p>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary">
                            <span class="text-gold fw-bold" th:text="'S/ ' + ${servicio.precio}">S/ 0.00</span>
                            <span class="badge bg-dark border border-secondary text-secondary" th:text="${servicio.duracion} + ' min'">30 min</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12" th:if="${#lists.isEmpty(servicios)}">
                <p class="text-center text-secondary py-3">No hay servicios disponibles en este momento.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
