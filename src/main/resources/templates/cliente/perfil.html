
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout('Mi Perfil', ~{::content})}">
<body>

<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-4 shadow-sm border-secondary">
                <h3 class="h4 text-gold mb-3 fw-bold text-center">Mi Perfil</h3>
                <p class="text-secondary small text-center mb-4">Actualiza tu foto de perfil</p>

                <!-- Alertas -->
                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="text-center mb-4">
                    <div th:if="${usuario.fotoUrl != null and !#strings.isEmpty(usuario.fotoUrl)}">
                        <img th:src="${usuario.fotoUrl}" 
                             alt="Mi Foto" 
                             class="rounded-circle border border-warning shadow" 
                             style="width: 120px; height: 120px; object-fit: cover;">
                    </div>
                    <div th:unless="${usuario.fotoUrl != null and !#strings.isEmpty(usuario.fotoUrl)}">
                        <i class="bi bi-person-circle text-gold" style="font-size: 5rem;"></i>
                    </div>
                    <h5 class="text-white mt-2 mb-0" th:text="${usuario.nombre}">Nombre Cliente</h5>
                    <small class="text-secondary" th:text="${usuario.correo}">correo@ejemplo.com</small>
                </div>

                <form th:action="@{/cliente/perfil/actualizar-foto}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Seleccionar Nueva Foto</label>
                        <input type="file" name="archivoFoto" class="form-control bg-dark text-white border-secondary" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-gold w-100 py-2">
                        <i class="bi bi-upload me-1"></i> Guardar Nueva Foto
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
