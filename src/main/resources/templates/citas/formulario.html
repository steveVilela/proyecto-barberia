<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout('Agendar Cita', ~{::content})}">
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold">Agendar Nueva Cita</h2>
            <span class="text-secondary small">Selecciona el cliente, el barbero y el servicio a realizar</span>
        </div>
        <a th:href="@{/citas}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4 shadow-sm">
                <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
                    <input type="hidden" th:field="*{idCita}">
                    <input type="hidden" th:field="*{estado}" th:value="${cita.estado != null ? cita.estado : 'PENDIENTE'}">

                    <div class="row g-3">
                        <!-- Seleccionar Cliente -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Cliente *</label>
                            <select th:field="*{usuario.idUsuario}" class="form-select bg-dark text-white border-secondary" required>
                                <option value="" disabled selected>-- Selecciona un cliente --</option>
                                <option th:each="u : ${usuarios}" 
                                        th:value="${u.idUsuario}" 
                                        th:text="${u.nombre} + ' (' + ${u.correo} + ')'">Juan Pérez (juan@mail.com)</option>
                            </select>
                        </div>

                        <!-- Seleccionar Barbero -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Barbero Asignado *</label>
                            <select th:field="*{barbero.idBarbero}" class="form-select bg-dark text-white border-secondary" required>
                                <option value="" disabled selected>-- Selecciona un barbero --</option>
                                <option th:each="b : ${barberos}" 
                                        th:value="${b.idBarbero}" 
                                        th:text="${b.nombre} + ' - ' + ${b.especialidad}">Carlos - Fade / Diseños</option>
                            </select>
                        </div>

                        <!-- Seleccionar Servicio -->
                        <div class="col-12">
                            <label class="form-label text-secondary small">Servicio *</label>
                            <select th:field="*{servicio.idServicio}" class="form-select bg-dark text-white border-secondary" required>
                                <option value="" disabled selected>-- Selecciona un servicio --</option>
                                <option th:each="s : ${servicios}" 
                                        th:value="${s.idServicio}" 
                                        th:text="${s.nombre} + ' | S/ ' + ${#numbers.formatDecimal(s.precio, 1, 2)} + ' (' + ${s.duracion} + ' min)'">
                                    Corte Clásico | S/ 15.00 (30 min)
                                </option>
                            </select>
                        </div>

                        <!-- Fecha de la Cita -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Fecha *</label>
                            <input type="date" th:field="*{fecha}" class="form-control bg-dark text-white border-secondary" required>
                        </div>

                        <!-- Hora de la Cita -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Hora *</label>
                            <input type="time" th:field="*{hora}" class="form-control bg-dark text-white border-secondary" required>
                        </div>

                        <!-- Observaciones / Indicaciones -->
                        <div class="col-12">
                            <label class="form-label text-secondary small">Observaciones adicionales (Opcional)</label>
                            <textarea th:field="*{observacion}" rows="3" class="form-control bg-dark text-white border-secondary" 
                                      placeholder="Ej. El cliente solicita diseño en la ceja o prefiere toalla fría..."></textarea>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="col-12 mt-4 d-flex justify-content-end gap-2 border-top border-secondary pt-3">
                            <a th:href="@{/citas}" class="btn btn-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-gold px-4">
                                <i class="bi bi-calendar-check me-1"></i> Confirmar y Agendar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
