<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - BarberApp'">BarberApp</title>
    
    <!-- Bootstrap 5 y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-color: #0f1117; 
            color: #e1e7ef; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
        }
        .sidebar { 
            background-color: #161b22; 
            min-height: 100vh; 
            border-right: 1px solid #30363d; 
        }
        .sidebar .nav-link { 
            color: #8b949e; 
            border-radius: 8px; 
            margin-bottom: 6px; 
            padding: 10px 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover { 
            background-color: #21262d; 
            color: #d4af37; 
        }
        .text-gold { color: #d4af37 !important; }
        .bg-gold { background-color: #d4af37 !important; color: #121212 !important; }
        .btn-gold {
            background-color: #d4af37;
            color: #121212;
            font-weight: 600;
            border: none;
        }
        .btn-gold:hover {
            background-color: #bfa030;
            color: #121212;
        }
        .card-custom { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
        }
        .table-dark-custom { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            overflow: hidden; 
        }
        .table-dark-custom th { 
            background-color: #21262d; 
            color: #8b949e; 
            font-weight: 600; 
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Reutilizable -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3 collapse d-md-flex flex-column justify-content-between">
            <div>
                <!-- Brand / Logo -->
                <div class="d-flex align-items-center mb-4 pb-3 border-bottom border-secondary">
                    <i class="bi bi-scissors fs-3 text-gold me-2"></i>
                    <span class="fs-5 fw-bold text-white">BarberApp</span>
                </div>

                <!-- Menú de Navegación por Roles -->
                <ul class="nav flex-column" th:if="${session.usuarioLogueado != null}">
                    
                    <!-- 1. Menú ADMIN -->
                    <th:block th:if="${session.usuarioLogueado.rol == 'ADMIN'}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/barberos}">
                                <i class="bi bi-people me-2"></i> Barberos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/servicios}">
                                <i class="bi bi-scissors me-2"></i> Servicios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/citas}">
                                <i class="bi bi-calendar-check me-2"></i> Gestión Citas
                            </a>
                        </li>
						<li class="nav-item">
						    <a class="nav-link" th:href="@{/admin/usuarios}">
						        <i class="bi bi-person-lines-fill me-2"></i> Usuarios
						    </a>
						</li>
                    </th:block>

                    <!-- 2. Menú BARBERO -->
                    <th:block th:if="${session.usuarioLogueado.rol == 'BARBERO'}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/barbero/citas}">
                                <i class="bi bi-calendar-day me-2"></i> Mi Agenda
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/servicios}">
                                <i class="bi bi-scissors me-2"></i> Catálogo Servicios
                            </a>
                        </li>
                    </th:block>

                    <!-- 3. Menú CLIENTE -->
                    <th:block th:if="${session.usuarioLogueado.rol == 'CLIENTE'}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/cliente/mis-citas}">
                                <i class="bi bi-scissors me-2"></i> Servicios Disponibles
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/citas}">
                                <i class="bi bi-clock-history me-2"></i> Mis Reservas
                            </a>
                        </li>
                    </th:block>

                </ul>
            </div>

            <!-- Perfil del Usuario en Sesión y Botón Salir -->
            <div class="border-top border-secondary pt-3 mt-4">
                <div class="d-flex align-items-center mb-2">
                    <div class="me-2">
                        <i class="bi bi-person-circle fs-3 text-gold"></i>
                    </div>
                    <div class="overflow-hidden">
                        <small class="d-block fw-bold text-truncate" 
                               th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'Usuario'}">Usuario</small>
                        <span class="badge bg-gold small" 
                              th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.rol : 'ROL'}">ROL</span>
                    </div>
                </div>
                <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger w-100 mt-2">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </a>
            </div>
        </nav>

        <!-- Bloque de Contenido Dinámico -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div th:replace="${contenido}"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
