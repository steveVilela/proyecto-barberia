<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - BarberApp'">BarberApp</title>
    
    <!-- Bootstrap 5 y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-color: #0f1117; 
            color: #e1e7ef; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
        }
        .sidebar { 
            background-color: #161b22; 
            min-height: 100vh; 
            height: 100dvh;
            overflow-y: auto;
            border-right: 1px solid #30363d; 
        }
        .sidebar .nav-link { 
            color: #8b949e; 
            border-radius: 8px; 
            margin-bottom: 6px; 
            padding: 10px 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover { 
            background-color: #21262d; 
            color: #d4af37; 
        }
        .text-gold { color: #d4af37 !important; }
        .bg-gold { background-color: #d4af37 !important; color: #121212 !important; }
        .btn-gold {
            background-color: #d4af37;
            color: #121212;
            font-weight: 600;
            border: none;
        }
        .btn-gold:hover {
            background-color: #bfa030;
            color: #121212;
        }
        .card-custom { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
        }
        .table-dark-custom { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            overflow: hidden; 
        }
        .table-dark-custom th { 
            background-color: #21262d; 
            color: #8b949e; 
            font-weight: 600; 
        }
        .navbar-mobile {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .offcanvas-dark {
            background-color: #161b22;
            color: #e1e7ef;
        }
    </style>
</head>
<body>

<!-- Barra superior visible SOLO en móviles -->
<header class="navbar navbar-mobile d-md-none p-3">
    <div class="d-flex align-items-center">
        <i class="bi bi-scissors fs-4 text-gold me-2"></i>
        <span class="fs-5 fw-bold text-white">BarberApp</span>
    </div>
    <button class="btn btn-outline-secondary border-0 text-gold" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
        <i class="bi bi-list fs-2"></i>
    </button>
</header>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar: Deslizable en móvil (offcanvas-md) y columna fija en escritorio (d-md-block) -->
        <nav id="sidebarMenu" class="col-md-3 col-lg-2 offcanvas-md offcanvas-start sidebar p-3 offcanvas-dark" tabindex="-1" aria-labelledby="sidebarMenuLabel">
            <div class="d-flex flex-column justify-content-between h-100">
                <div>
                    <!-- Encabezado Sidebar -->
                    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-scissors fs-3 text-gold me-2"></i>
                            <span class="fs-5 fw-bold text-white">BarberApp</span>
                        </div>
                        <!-- Botón cerrar solo visible en móvil -->
                        <button type="button" class="btn-close btn-close-white d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
                    </div>

                    <!-- Menú de Navegación por Roles -->
                    <ul class="nav flex-column" th:if="${session.usuarioLogueado != null}">
                        
                        <!-- 1. Menú ADMIN -->
                        <th:block th:if="${session.usuarioLogueado.rol == 'ADMIN'}">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/dashboard}">
                                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/barberos}">
                                    <i class="bi bi-people me-2"></i> Barberos
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/servicios}">
                                    <i class="bi bi-scissors me-2"></i> Servicios
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/citas}">
                                    <i class="bi bi-calendar-check me-2"></i> Gestión Citas
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/usuarios}">
                                    <i class="bi bi-person-lines-fill me-2"></i> Usuarios
                                </a>
                            </li>
                        </th:block>

                        <!-- 2. Menú BARBERO -->
                        <th:block th:if="${session.usuarioLogueado.rol == 'BARBERO'}">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/barbero/citas}">
                                    <i class="bi bi-calendar-day me-2"></i> Mi Agenda
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/servicios}">
                                    <i class="bi bi-scissors me-2"></i> Catálogo Servicios
                                </a>
                            </li>
                        </th:block>

                        <!-- 3. Menú CLIENTE -->
                        <th:block th:if="${session.usuarioLogueado.rol == 'CLIENTE'}">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/cliente/mis-citas}">
                                    <i class="bi bi-scissors me-2"></i> Servicios Disponibles
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/citas}">
                                    <i class="bi bi-clock-history me-2"></i> Mis Reservas
                                </a>
                            </li>
                        </th:block>

                    </ul>
                </div>

                <!-- Perfil del Usuario y Salir -->
                <!-- Perfil del Usuario y Salir -->
<div class="border-top border-secondary pt-3 mt-4" style="padding-bottom: 75px;">
    <div class="d-flex align-items-center mb-2">
        <div class="me-2">
            <i class="bi bi-person-circle fs-3 text-gold"></i>
        </div>
        <div class="overflow-hidden">
            <small class="d-block fw-bold text-truncate" 
                   th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'Usuario'}">Usuario</small>
            <span class="badge bg-gold small" 
                  th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.rol : 'ROL'}">ROL</span>
        </div>
    </div>
    <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger w-100 mt-2 py-2 fw-semibold">
        <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
    </a>
</div>

            </div>
        </nav>

        <!-- Bloque de Contenido Dinámico -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div th:replace="${contenido}"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
