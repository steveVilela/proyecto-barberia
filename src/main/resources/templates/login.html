<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberApp - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .btn-gold {
            background-color: #d4af37;
            color: #121212;
            font-weight: 600;
            border: none;
        }
        .btn-gold:hover {
            background-color: #bfa030;
            color: #121212;
        }
        .form-control {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus {
            background-color: #2a2a2a;
            border-color: #d4af37;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
        }
    </style>
</head>
<body>

<div class="card-login">
    <div class="text-center mb-4">
        <i class="bi bi-scissors fs-1 text-warning"></i>
        <h3 class="fw-bold mt-2">BARBER APP</h3>
        <p class="text-secondary small">Panel de Control & Gestión de Citas</p>
    </div>

    <!-- Mensaje de error si falla la autenticación -->
    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>
    
    <!-- Mensaje al cerrar sesión -->
    <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">Sesión finalizada correctamente.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small text-secondary">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                <input type="email" name="correo" class="form-control" placeholder="admin@barberia.com" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small text-secondary">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-gold w-100 py-2">Ingresar al Sistema</button>
    </form>
</div>

</body>
</html>
