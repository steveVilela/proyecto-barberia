<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout('Control de Citas de Hoy', ~{::content})}">
<body>

<div th:fragment="content">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold">Panel Diario de Citas</h2>
            <span class="text-secondary small" th:text="'Supervisión a cargo de: ' + ${usuario.nombre}">Encargado</span>
        </div>
        <span class="badge bg-dark border border-secondary p-2 text-gold" 
              th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
    </div>

    <!-- Tabla de Citas del Día -->
    <div class="table-dark-custom p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-white mb-0">
                <i class="bi bi-calendar-check me-2 text-gold"></i>Citas Programadas para Hoy
            </h5>
            <span class="badge bg-secondary" th:text="${#lists.size(citasHoy)} + ' turnos'">0 turnos</span>
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width: 85px;">Hora</th>
                        <th>Cliente</th>
                        <th>Barbero Asignado</th>
                        <th>Servicio</th>
                        <th>Observación</th>
                        <th style="width: 120px;">Estado</th>
                        <th class="text-center" style="width: 130px;">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${citasHoy}" 
                        th:with="estadoActual=${cita.estado != null and !#strings.isEmpty(#strings.trim(cita.estado)) ? #strings.trim(cita.estado) : 'PENDIENTE'}">
                        
                        <td class="fw-bold text-gold" th:text="${cita.hora}">10:00</td>
                        <td class="text-white fw-semibold" th:text="${cita.usuario != null ? cita.usuario.nombre : 'Cliente General'}">Cliente</td>
                        <td>
                            <span class="badge bg-dark border border-secondary text-warning" 
                                  th:text="${cita.barbero != null ? cita.barbero.nombre : 'Por asignar'}">Mateo</span>
                        </td>
                        <td th:text="${cita.servicio != null ? cita.servicio.nombre : 'Corte Clásico'}">Servicio</td>
                        <td class="text-secondary small" th:text="${cita.observacion != null && !#strings.isEmpty(cita.observacion) ? cita.observacion : '-'}">-</td>
                        
                        <!-- Columna Estado con variable normalizada -->
                        <td>
                            <span class="badge" 
                                  th:classappend="${estadoActual == 'CONFIRMADA' ? 'bg-success' : (estadoActual == 'FINALIZADA' ? 'bg-info text-dark' : (estadoActual == 'CANCELADA' ? 'bg-danger' : 'bg-warning text-dark'))}"
                                  th:text="${estadoActual}">PENDIENTE</span>
                        </td>

                        <!-- Columna de Botones de Acción -->
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <!-- 1. Botón Confirmar: Visible si está PENDIENTE -->
                                <a th:if="${estadoActual == 'PENDIENTE'}" 
                                   th:href="@{/barbero/citas/estado/{id}/CONFIRMADA(id=${cita.idCita})}" 
                                   class="btn btn-outline-success" 
                                   title="Confirmar llegada del cliente">
                                    <i class="bi bi-check-lg"></i>
                                </a>

                                <!-- 2. Botón Finalizar: Visible si ya está CONFIRMADA -->
                                <a th:if="${estadoActual == 'CONFIRMADA'}" 
                                   th:href="@{/barbero/citas/estado/{id}/FINALIZADA(id=${cita.idCita})}" 
                                   class="btn btn-outline-info" 
                                   title="Finalizar corte / servicio">
                                    <i class="bi bi-scissors"></i>
                                </a>

                                <!-- 3. Botón Cancelar: Disponible mientras no esté FINALIZADA ni CANCELADA -->
                                <a th:if="${estadoActual != 'FINALIZADA' and estadoActual != 'CANCELADA'}" 
                                   th:href="@{/barbero/citas/estado/{id}/CANCELADA(id=${cita.idCita})}" 
                                   class="btn btn-outline-danger" 
                                   title="Cancelar cita"
                                   onclick="return confirm('¿Seguro que deseas marcar esta cita como cancelada?');">
                                    <i class="bi bi-x-lg"></i>
                                </a>

                                <!-- 4. Guion si ya terminó o fue cancelada -->
                                <span th:if="${estadoActual == 'FINALIZADA' or estadoActual == 'CANCELADA'}" 
                                      class="text-secondary small">Cerrado</span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citasHoy)}">
                        <td colspan="7" class="text-center text-secondary py-4">
                            No hay citas programadas para el día de hoy.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
