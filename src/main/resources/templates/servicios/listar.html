<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragmentos/layout :: layout('Catálogo de Servicios', ~{::content})}">
<body>

<div th:fragment="content">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
        <div>
            <h2 class="h4 mb-0 fw-bold">Catálogo de Servicios</h2>
            <span class="text-secondary small">Cortes, afeitados y tratamientos disponibles</span>
        </div>
        <!-- Botón visible solo para ADMIN -->
        <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'ADMIN'}" 
           th:href="@{/servicios/nuevo}" class="btn btn-gold btn-sm">
            <i class="bi bi-plus-circle me-1"></i> Nuevo Servicio
        </a>
    </div>

    <!-- Grid / Cards de Servicios -->
    <div class="row g-4">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="servicio : ${servicios}">
            <div class="card card-custom h-100 overflow-hidden shadow-sm d-flex flex-column">
                
				<!-- Imagen del Servicio -->
				<div class="position-relative" style="height: 180px; background-color: #21262d;">
				    <img th:if="${servicio.fotoUrl != null and !#strings.isEmpty(servicio.fotoUrl)}" 
				         th:src="${servicio.fotoUrl}" 
				         class="w-100 h-100 object-fit-cover" 
				         alt="Foto Servicio"
				         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
				    
				    <div class="w-100 h-100 align-items-center justify-content-center text-secondary"
				         th:style="${servicio.fotoUrl != null and !#strings.isEmpty(servicio.fotoUrl)} ? 'display: none;' : 'display: flex;'">
				        <i class="bi bi-scissors fs-1 text-gold"></i>
				    </div>
				    <!-- Estado Badge -->
				    <span class="position-absolute top-0 end-0 m-2 badge"
				          th:classappend="${servicio.estado == 'ACTIVO' ? 'bg-success' : 'bg-danger'}"
				          th:text="${servicio.estado}">ACTIVO</span>
				</div>
				
				
                <!-- Detalles -->
                <div class="card-body p-3 d-flex flex-column flex-grow-1">
                    <h5 class="fw-bold text-white mb-1" th:text="${servicio.nombre}">Corte Fade</h5>
                    <p class="text-secondary small flex-grow-1 mb-3" 
                       th:text="${servicio.descripcion != null and !servicio.descripcion.isEmpty() ? servicio.descripcion : 'Sin descripción detallada.'}">
                        Descripción breve del servicio.
                    </p>
                    
                    <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-2">
                        <div>
                            <span class="text-secondary small d-block">Precio</span>
                            <span class="fs-5 fw-bold text-gold" th:text="'S/ ' + ${#numbers.formatDecimal(servicio.precio, 1, 2)}">S/ 35.00</span>
                        </div>
                        <div class="text-end">
                            <span class="text-secondary small d-block">Duración</span>
                            <span class="badge bg-dark border border-secondary text-white">
                                <i class="bi bi-clock me-1 text-gold"></i><span th:text="${servicio.duracion} + ' min'">45 min</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Acciones para ADMIN -->
                <div class="card-footer bg-dark border-top border-secondary p-2 d-flex justify-content-end gap-2" 
                     th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'ADMIN'}">
                    <a th:href="@{/servicios/editar/{id}(id=${servicio.idServicio})}" class="btn btn-sm btn-outline-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/servicios/eliminar/{id}(id=${servicio.idServicio})}" 
                       class="btn btn-sm btn-outline-danger" 
                       onclick="return confirm('¿Seguro que deseas eliminar este servicio?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Mensaje si no hay registros -->
        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(servicios)}">
            <i class="bi bi-scissors fs-1 text-secondary d-block mb-2"></i>
            <h5 class="text-secondary">No hay servicios registrados en este momento.</h5>
        </div>
    </div>
</div>

</body>
</html>
